
name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-latest
            artifact: represent-linux-amd64.tar.gz

          - target: mac
            runner: macos-latest
            artifact: represent-macos-arm64.tar.gz

          - target: win
            runner: windows-latest
            artifact: represent-windows-amd64.zip

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Make build script executable
        if: runner.os != 'Windows'
        run: chmod +x build.sh

      - name: Build
        shell: bash
        run: ./build.sh ${{ matrix.target }}

      - name: Prepare platform directory
        shell: bash
        run: |
          mkdir -p "release/${{ matrix.target }}"

          if [ "${{ matrix.target }}" = "win" ]; then
            cp represent.exe "release/${{ matrix.target }}/"
          else
            cp represent "release/${{ matrix.target }}/"
          fi

      - name: Package Linux/macOS binary
        if: matrix.target != 'win'
        shell: bash
        run: |
          tar -czf "release/${{ matrix.artifact }}" \
            -C "release/${{ matrix.target }}" .

      - name: Package Windows binary
        if: matrix.target == 'win'
        shell: bash
        run: |
          7z a "release/${{ matrix.artifact }}" \
            "./release/${{ matrix.target }}/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*'
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --notes-file CHANGELOG.md
